name: Polynomial-minor library short gates

on:
  push:
    branches: [codex/polynomial-minors-library]
    paths:
      - '.github/workflows/polynomial-minors-library-smoke.yml'
      - 'scripts/codegen/polynomial_minors*'
      - 'scripts/codegen/validate_polynomial_minors.py'
      - 'scripts/codegen/audit_polynomial_minors_smoke.py'
      - 'scripts/codegen/smoke_polynomial_minors.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'tests/test_codegen_polynomial_minors*.py'
      - 'data/matrices/untiered/PM_*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build unchanged solver
        run: make --jobs=2 bin/distqldpc
      - name: Independent physical, Smith, logical, source word and unit contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_codegen_*.py'
          python3 scripts/codegen/validate_css.py --output /tmp/gh209-css.json
          cmp data/matrices/untiered/validation.json /tmp/gh209-css.json
          python3 scripts/codegen/validate_polynomial_minors.py --out /tmp/gh209-construction.json
          cmp optimization/experiments/GH-209/raw/construction.json /tmp/gh209-construction.json
      - name: Reproduce all24 matrix files byte for byte
        run: |
          python3 scripts/codegen/polynomial_minors.py --all --out /tmp/gh209-rebuilt
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/gh209-rebuilt').glob('*.txt'))
          assert len(files)==24
          for p in files:
              assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          print('PASS24matrixbyteidentical')
          PY
      - name: Six serial default MaxSAT 60CPU-second checks
        run: python3 scripts/codegen/smoke_polynomial_minors.py --ci --engine maxsat --out /tmp/gh209-maxsat
      - name: Six serial explicit CC 60CPU-second checks
        run: python3 scripts/codegen/smoke_polynomial_minors.py --ci --engine cc --out /tmp/gh209-cc
      - name: Cross-engine source claims and actual GF2 word audit
        run: python3 scripts/codegen/audit_polynomial_minors_smoke.py --maxsat /tmp/gh209-maxsat --cc /tmp/gh209-cc --construction /tmp/gh209-construction.json --out /tmp/gh209-smoke-audit.json
      - name: Retain complete lossless evidence even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          evidence={}
          for label in ('maxsat','cc'):
              root=Path('/tmp/gh209-'+label)
              evidence[label]={str(p.relative_to(root)):p.read_text() for p in root.rglob('*') if p.is_file()}
          for name in ('construction','smoke-audit'):
              p=Path('/tmp/gh209-'+name+'.json')
              if p.exists():evidence[name]=p.read_text()
          payload=json.dumps(evidence,separators=(',',':')).encode()
          encoded=base64.b64encode(gzip.compress(payload,mtime=0)).decode()
          chunks=[encoded[i:i+40000] for i in range(0,len(encoded),40000)]
          print('GH209_EVIDENCE_PAYLOAD_SHA256='+hashlib.sha256(payload).hexdigest())
          print('GH209_EVIDENCE_PAYLOAD_BYTES='+str(len(payload)))
          for i,part in enumerate(chunks):
              print(f'GH209_EVIDENCE_GZIP_B64={i+1}/{len(chunks)}:'+part)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh209-polynomial-minor-short-gates
          path: |
            /tmp/gh209-maxsat/
            /tmp/gh209-cc/
            /tmp/gh209-construction.json
            /tmp/gh209-smoke-audit.json
          if-no-files-found: warn
          retention-days: 14
