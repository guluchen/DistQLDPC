name: BCH retained evidence contracts

on:
  push:
    branches: [codex/bch-library]
    paths:
      - 'scripts/codegen/bch*'
      - 'scripts/codegen/validate_bch.py'
      - 'scripts/codegen/audit_bch_smoke.py'
      - 'scripts/codegen/smoke_bch.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'tests/test_codegen_bch*.py'
      - 'data/matrices/untiered/BCH_*.txt'
      - 'optimization/experiments/GH-207/raw/certificates/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Unit, physical root construction and complete logical contracts without solver
        run: |
          python3 -m unittest discover -s tests -p 'test_codegen_*.py'
          python3 scripts/codegen/validate_css.py --output /tmp/gh207-css.json
          cmp data/matrices/untiered/validation.json /tmp/gh207-css.json
          python3 scripts/codegen/validate_bch.py --out /tmp/gh207-construction.json
          cmp optimization/experiments/GH-207/raw/construction.json /tmp/gh207-construction.json
      - name: Reproduce all20 matrix files byte for byte
        run: |
          python3 scripts/codegen/bch.py --all --out /tmp/gh207-rebuilt
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/gh207-rebuilt').glob('*.txt'))
          assert len(files)==20
          for p in files:
              assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          print('PASS20matrixbyteidentical')
          PY
      - name: Replay original ten engine logs and physical words only
        run: |
          python3 scripts/codegen/audit_bch_smoke.py --maxsat optimization/experiments/GH-207/raw/actions/default/maxsat --cc optimization/experiments/GH-207/raw/actions/default/cc --construction optimization/experiments/GH-207/raw/construction.json --out /tmp/gh207-replayed.json
          cmp optimization/experiments/GH-207/raw/actions/default/audit.json /tmp/gh207-replayed.json
      - name: Independently verify finite field-root certificates and detectors, no distance search
        run: |
          python3 scripts/codegen/bch_certificate.py --verify optimization/experiments/GH-207/raw/certificates --out /tmp/gh207-certificates.json
          cmp optimization/experiments/GH-207/raw/certificates/VERDICT.json /tmp/gh207-certificates.json
