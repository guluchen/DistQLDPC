name: General static pin-relation CSS library smoke

on:
  push:
    branches: [codex/pin-relation-library]
    paths:
      - '.github/workflows/pin-relation-library-smoke.yml'
      - 'scripts/codegen/pin_relation*'
      - 'scripts/codegen/validate_pin_relations.py'
      - 'scripts/codegen/audit_pin_relation_smoke.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/validate_css.py'
      - 'tests/test_codegen_pin_relations.py'
      - 'tests/test_codegen_color666.py'
      - 'data/matrices/untiered/PIN_*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
      - name: Build unchanged solver
        run: make --jobs=2 bin/distqldpc
      - name: Independent algebra, complete logicals, tiny units and retained inventory
        run: |
          python3 tests/test_codegen_pin_relations.py
          python3 tests/test_codegen_twisted_torus.py
          python3 tests/test_codegen_color666.py
          python3 tests/test_codegen_hgp.py
          python3 tests/test_codegen_cycle.py
          python3 scripts/codegen/validate_css.py --output /tmp/css-validation.json
          cmp data/matrices/untiered/validation.json /tmp/css-validation.json
          python3 scripts/codegen/validate_pin_relations.py --out /tmp/pin_relations-construction.json
          cmp optimization/experiments/GH-189/raw/construction.json /tmp/pin_relations-construction.json
      - name: Reproduce all24 new matrix files
        run: |
          python3 scripts/codegen/pin_relations.py --all --out /tmp/pin_relations-rebuilt --certificates /tmp/pin_relations-certificates
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/pin_relations-rebuilt').glob('*.txt'))
          assert len(files)==24
          for p in files:
              assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          certs=list(Path('/tmp/pin_relations-certificates').glob('*.json'))
          assert len(certs)==6
          for p in certs:
              assert p.read_bytes()==(Path('optimization/experiments/GH-189/raw/certificates')/p.name).read_bytes(),p
          print('PASS:24 matrices and6 full certificates reproduced byte for byte')
          PY
      - name: Six default MaxSAT60s serial smoke checks
        run: python3 scripts/codegen/smoke_untiered.py --ci --family PIN --stems PIN_160_64_unknown PIN_240_142_unknown PIN_256_30_unknown PIN_1152_60_unknown PIN_1728_84_unknown PIN_2304_207_unknown --verbose --out /tmp/pin_relations-maxsat
      - name: Six CC60s serial independent-engine checks
        if: success() || failure()
        run: python3 scripts/codegen/smoke_untiered.py --ci --family PIN --stems PIN_160_64_unknown PIN_240_142_unknown PIN_256_30_unknown PIN_1152_60_unknown PIN_1728_84_unknown PIN_2304_207_unknown --engine cc --verbose --out /tmp/pin_relations-cc
      - name: Audit actual words, source/binary/input identity and independent results
        if: success() || failure()
        run: python3 scripts/codegen/audit_pin_relation_smoke.py --maxsat /tmp/pin_relations-maxsat --cc /tmp/pin_relations-cc --construction optimization/experiments/GH-189/raw/construction.json --out /tmp/pin_relations-audit.json
      - name: Retain every raw result even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result={}
          for label in ('pin_relations-maxsat','pin_relations-cc'):
              root=Path('/tmp')/label
              result[label]={p.name:p.read_text() for p in root.glob('*') if p.is_file()}
          print('GH189_EVIDENCE_JSON='+json.dumps(result,separators=(',',':')))
          audit=Path('/tmp/pin_relations-audit.json')
          if audit.exists():print('GH189_AUDIT_JSON='+json.dumps(json.loads(audit.read_text()),separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh189-pin_relations-smoke
          path: |
            /tmp/pin_relations-maxsat/
            /tmp/pin_relations-cc/
            /tmp/pin_relations-audit.json
          if-no-files-found: warn
          retention-days: 14
