name: Single-sector homological-product CSS library smoke

on:
  push:
    branches: [codex/homological-product-library]
    paths:
      - '.github/workflows/homological-product-library-smoke.yml'
      - 'scripts/codegen/homological_product*'
      - 'scripts/codegen/validate_homological_product.py'
      - 'scripts/codegen/audit_homological_product_smoke.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/validate_css.py'
      - 'tests/test_codegen_homological_product.py'
      - 'data/matrices/untiered/HPC_*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build unchanged solver
        run: make --jobs=2 bin/distqldpc
      - name: Independent algebra, complete logicals, tiny units and retained inventory
        run: |
          python3 tests/test_codegen_homological_product.py
          python3 tests/test_codegen_twisted_torus.py
          python3 tests/test_codegen_color666.py
          python3 tests/test_codegen_hgp.py
          python3 tests/test_codegen_cycle.py
          python3 scripts/codegen/validate_css.py --output /tmp/css-validation.json
          cmp data/matrices/untiered/validation.json /tmp/css-validation.json
          python3 scripts/codegen/validate_homological_product.py --out /tmp/homological_product-construction.json
          cmp optimization/experiments/GH-179/raw/construction.json /tmp/homological_product-construction.json
      - name: Reproduce all24 new matrix files
        run: |
          python3 scripts/codegen/homological_product.py --all --out /tmp/homological_product-rebuilt
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/homological_product-rebuilt').glob('*.txt'))
          assert len(files)==24
          for p in files:
              assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          print('PASS:24 homological-product matrix files reproduced byte for byte')
          PY
      - name: Six default MaxSAT60s serial smoke checks
        run: python3 scripts/codegen/smoke_untiered.py --ci --family HPC --stems HPC_169_9_unknown HPC_361_25_unknown HPC_841_49_unknown HPC_1369_81_unknown HPC_1849_121_unknown HPC_2809_169_unknown --verbose --out /tmp/homological_product-maxsat
      - name: Six CC60s serial independent-engine checks
        if: success() || failure()
        run: python3 scripts/codegen/smoke_untiered.py --ci --family HPC --stems HPC_169_9_unknown HPC_361_25_unknown HPC_841_49_unknown HPC_1369_81_unknown HPC_1849_121_unknown HPC_2809_169_unknown --engine cc --verbose --out /tmp/homological_product-cc
      - name: Audit actual words, source/binary/input identity and independent results
        if: success() || failure()
        run: python3 scripts/codegen/audit_homological_product_smoke.py --maxsat /tmp/homological_product-maxsat --cc /tmp/homological_product-cc --construction optimization/experiments/GH-179/raw/construction.json --out /tmp/homological_product-audit.json
      - name: Retain every raw result even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result={}
          for label in ('homological_product-maxsat','homological_product-cc'):
              root=Path('/tmp')/label
              result[label]={p.name:p.read_text() for p in root.glob('*') if p.is_file()}
          print('GH179_EVIDENCE_JSON='+json.dumps(result,separators=(',',':')))
          audit=Path('/tmp/homological_product-audit.json')
          if audit.exists():print('GH179_AUDIT_JSON='+json.dumps(json.loads(audit.read_text()),separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh179-homological_product-smoke
          path: |
            /tmp/homological_product-maxsat/
            /tmp/homological_product-cc/
            /tmp/homological_product-audit.json
          if-no-files-found: warn
          retention-days: 14
