name: Three-dimensional static color CSS library smoke

on:
  push:
    branches: [codex/color3d-library]
    paths:
      - '.github/workflows/color3d-library-smoke.yml'
      - 'scripts/codegen/color3d*'
      - 'scripts/codegen/validate_color3d.py'
      - 'scripts/codegen/audit_color3d_smoke.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/validate_css.py'
      - 'tests/test_codegen_color3d.py'
      - 'tests/test_codegen_color666.py'
      - 'data/matrices/untiered/COLOR_*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build unchanged solver
        run: make --jobs=2 bin/distqldpc
      - name: Independent algebra, complete logicals, tiny units and retained inventory
        run: |
          python3 tests/test_codegen_color3d.py
          python3 tests/test_codegen_twisted_torus.py
          python3 tests/test_codegen_color666.py
          python3 tests/test_codegen_hgp.py
          python3 tests/test_codegen_cycle.py
          python3 scripts/codegen/validate_css.py --output /tmp/css-validation.json
          cmp data/matrices/untiered/validation.json /tmp/css-validation.json
          python3 scripts/codegen/validate_color3d.py --out /tmp/color3d-construction.json
          cmp optimization/experiments/GH-185/raw/construction.json /tmp/color3d-construction.json
      - name: Reproduce all28 new matrix files
        run: |
          python3 scripts/codegen/color3d.py --all --out /tmp/color3d-rebuilt --certificates /tmp/color3d-certificates
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/color3d-rebuilt').glob('*.txt'))
          assert len(files)==28
          for p in files:
              assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          certs=list(Path('/tmp/color3d-certificates').glob('*.json'))
          assert len(certs)==7
          for p in certs:
              assert p.read_bytes()==(Path('optimization/experiments/GH-185/raw/certificates')/p.name).read_bytes(),p
          print('PASS:28 matrices and7 full certificates reproduced byte for byte')
          PY
      - name: Seven default MaxSAT60s serial smoke checks
        run: python3 scripts/codegen/smoke_untiered.py --ci --family COLOR --stems COLOR_8_3_unknown COLOR_384_9_unknown COLOR_576_9_unknown COLOR_864_9_unknown COLOR_1296_9_unknown COLOR_1728_9_unknown COLOR_2304_9_unknown --verbose --out /tmp/color3d-maxsat
      - name: Seven CC60s serial independent-engine checks
        if: success() || failure()
        run: python3 scripts/codegen/smoke_untiered.py --ci --family COLOR --stems COLOR_8_3_unknown COLOR_384_9_unknown COLOR_576_9_unknown COLOR_864_9_unknown COLOR_1296_9_unknown COLOR_1728_9_unknown COLOR_2304_9_unknown --engine cc --verbose --out /tmp/color3d-cc
      - name: Audit actual words, source/binary/input identity and independent results
        if: success() || failure()
        run: python3 scripts/codegen/audit_color3d_smoke.py --maxsat /tmp/color3d-maxsat --cc /tmp/color3d-cc --construction optimization/experiments/GH-185/raw/construction.json --out /tmp/color3d-audit.json
      - name: Retain every raw result even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result={}
          for label in ('color3d-maxsat','color3d-cc'):
              root=Path('/tmp')/label
              result[label]={p.name:p.read_text() for p in root.glob('*') if p.is_file()}
          print('GH185_EVIDENCE_JSON='+json.dumps(result,separators=(',',':')))
          audit=Path('/tmp/color3d-audit.json')
          if audit.exists():print('GH185_AUDIT_JSON='+json.dumps(json.loads(audit.read_text()),separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh185-color3d-smoke
          path: |
            /tmp/color3d-maxsat/
            /tmp/color3d-cc/
            /tmp/color3d-audit.json
          if-no-files-found: warn
          retention-days: 14
