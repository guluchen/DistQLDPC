name: Schreier500 diagnosis retained contracts

on:
  push:
    branches: [codex/schreier-tanner-library]
    paths:
      - 'optimization/experiments/GH-202/diagnostic/**'
      - 'optimization/experiments/GH-202/raw/authorized-cc500/**'
      - 'tests/test_schreier_cc500_diagnostic.py'

permissions:
  contents: read

jobs:
  retained-cc500:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Eight no-solver frozen-input and diagnostic contracts
        run: python3 tests/test_schreier_cc500_diagnostic.py
      - name: Replay original MaxSAT and authorized CC words only
        run: python3 optimization/experiments/GH-202/diagnostic/replay_cc500.py
