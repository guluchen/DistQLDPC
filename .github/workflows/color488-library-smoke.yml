name: Triangular4.8.8 color library smoke

on:
  push:
    branches: [codex/color488-library]
    paths:
      - '.github/workflows/color488-library-smoke.yml'
      - 'scripts/codegen/color488*'
      - 'scripts/codegen/validate_color488.py'
      - 'scripts/codegen/audit_color488_smoke.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/validate_css.py'
      - 'tests/test_codegen_color488.py'
      - 'data/matrices/untiered/COLOR_*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build unchanged solver
        run: make --jobs=2 bin/distqldpc
      - name: Independent algebra, complete logicals, tiny units and retained inventory
        run: |
          python3 tests/test_codegen_color488.py
          python3 tests/test_codegen_twisted_torus.py
          python3 tests/test_codegen_color666.py
          python3 tests/test_codegen_hgp.py
          python3 tests/test_codegen_cycle.py
          python3 scripts/codegen/validate_css.py --output /tmp/css-validation.json
          cmp data/matrices/untiered/validation.json /tmp/css-validation.json
          python3 scripts/codegen/validate_color488.py --output /tmp/color488-construction.json
          cmp optimization/experiments/GH-172/raw/construction.json /tmp/color488-construction.json
      - name: Reproduce all24 new matrix files
        run: |
          python3 scripts/codegen/color488.py --all --out /tmp/color488-rebuilt
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/color488-rebuilt').glob('*.txt'))
          assert len(files)==24
          for p in files:
              assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          print('PASS:24 COLOR matrix files reproduced byte for byte')
          PY
      - name: Six default MaxSAT60s serial smoke checks
        run: python3 scripts/codegen/smoke_untiered.py --ci --family COLOR --stems COLOR_31_1_unknown COLOR_71_1_unknown COLOR_199_1_unknown COLOR_647_1_unknown COLOR_1567_1_unknown COLOR_2887_1_unknown --verbose --out /tmp/color488-maxsat
      - name: Six CC60s serial independent-engine checks
        if: success() || failure()
        run: python3 scripts/codegen/smoke_untiered.py --ci --family COLOR --stems COLOR_31_1_unknown COLOR_71_1_unknown COLOR_199_1_unknown COLOR_647_1_unknown COLOR_1567_1_unknown COLOR_2887_1_unknown --engine cc --verbose --out /tmp/color488-cc
      - name: Audit actual words, source/binary/input identity and independent results
        if: success() || failure()
        run: python3 scripts/codegen/audit_color488_smoke.py --maxsat /tmp/color488-maxsat --cc /tmp/color488-cc --out /tmp/color488-audit.json
      - name: Retain every raw result even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result={}
          for label in ('color488-maxsat','color488-cc'):
              root=Path('/tmp')/label
              result[label]={p.name:p.read_text() for p in root.glob('*') if p.is_file()}
          print('GH172_EVIDENCE_JSON='+json.dumps(result,separators=(',',':')))
          audit=Path('/tmp/color488-audit.json')
          if audit.exists():print('GH172_AUDIT_JSON='+json.dumps(json.loads(audit.read_text()),separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh172-divisor-color488-smoke
          path: |
            /tmp/color488-maxsat/
            /tmp/color488-cc/
            /tmp/color488-audit.json
          if-no-files-found: warn
          retention-days: 14
