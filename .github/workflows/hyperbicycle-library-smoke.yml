name: Hyperbicycle retained evidence contracts

on:
  push:
    branches: [codex/hyperbicycle-library]
    paths:
      - 'scripts/codegen/hyperbicycle*'
      - 'scripts/codegen/validate_hyperbicycle.py'
      - 'scripts/codegen/audit_hyperbicycle_smoke.py'
      - 'scripts/codegen/smoke_hyperbicycle.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'tests/test_codegen_hyperbicycle.py'
      - 'data/matrices/untiered/LP_*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Unit and independent construction contracts without new solver runs
        run: |
          python3 -m unittest discover -s tests -p 'test_codegen_*.py'
          python3 scripts/codegen/validate_css.py --output /tmp/gh205-css.json
          cmp data/matrices/untiered/validation.json /tmp/gh205-css.json
          python3 scripts/codegen/validate_hyperbicycle.py --out /tmp/gh205-construction.json
          cmp optimization/experiments/GH-205/raw/construction.json /tmp/gh205-construction.json
      - name: Reproduce all24 matrix files byte for byte
        run: |
          python3 scripts/codegen/hyperbicycle.py --all --out /tmp/gh205-rebuilt
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/gh205-rebuilt').glob('*.txt'))
          assert len(files)==24
          for p in files:
              assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          print('PASS24matrixbyteidentical')
          PY
      - name: Replay retained original scientific logs and GF2 words only
        run: |
          python3 scripts/codegen/audit_hyperbicycle_smoke.py --maxsat optimization/experiments/GH-205/raw/actions/default/maxsat --cc optimization/experiments/GH-205/raw/actions/default/cc --construction optimization/experiments/GH-205/raw/construction.json --out /tmp/gh205-replayed.json
          cmp optimization/experiments/GH-205/raw/actions/default/audit.json /tmp/gh205-replayed.json
