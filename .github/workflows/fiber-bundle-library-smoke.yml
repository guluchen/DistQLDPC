name: Finite circle-bundle CSS library smoke

on:
  push:
    branches: [codex/fiber-bundle-library]
    paths:
      - '.github/workflows/fiber-bundle-library-smoke.yml'
      - 'scripts/codegen/fiber_bundle*'
      - 'scripts/codegen/validate_fiber_bundle.py'
      - 'scripts/codegen/audit_fiber_bundle_smoke.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/validate_css.py'
      - 'tests/test_codegen_fiber_bundle.py'
      - 'data/matrices/untiered/FBC_*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build unchanged solver
        run: make --jobs=2 bin/distqldpc
      - name: Independent algebra, complete logicals, tiny units and retained inventory
        run: |
          python3 tests/test_codegen_fiber_bundle.py
          python3 tests/test_codegen_twisted_torus.py
          python3 tests/test_codegen_color666.py
          python3 tests/test_codegen_hgp.py
          python3 tests/test_codegen_cycle.py
          python3 scripts/codegen/validate_css.py --output /tmp/css-validation.json
          cmp data/matrices/untiered/validation.json /tmp/css-validation.json
          python3 scripts/codegen/validate_fiber_bundle.py --out /tmp/fiber_bundle-construction.json
          cmp optimization/experiments/GH-178/raw/construction.json /tmp/fiber_bundle-construction.json
      - name: Reproduce all24 new matrix files
        run: |
          python3 scripts/codegen/fiber_bundle.py --all --out /tmp/fiber_bundle-rebuilt
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/fiber_bundle-rebuilt').glob('*.txt'))
          assert len(files)==24
          for p in files:
              assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          print('PASS:24 covering BB matrix files reproduced byte for byte')
          PY
      - name: Six default MaxSAT60s serial smoke checks
        run: python3 scripts/codegen/smoke_untiered.py --ci --family FBC --stems FBC_252_4_unknown FBC_378_6_unknown FBC_1400_8_unknown FBC_1750_10_unknown FBC_2100_12_unknown FBC_2800_16_unknown --verbose --out /tmp/fiber_bundle-maxsat
      - name: Six CC60s serial independent-engine checks
        if: success() || failure()
        run: python3 scripts/codegen/smoke_untiered.py --ci --family FBC --stems FBC_252_4_unknown FBC_378_6_unknown FBC_1400_8_unknown FBC_1750_10_unknown FBC_2100_12_unknown FBC_2800_16_unknown --engine cc --verbose --out /tmp/fiber_bundle-cc
      - name: Audit actual words, source/binary/input identity and independent results
        if: success() || failure()
        run: python3 scripts/codegen/audit_fiber_bundle_smoke.py --maxsat /tmp/fiber_bundle-maxsat --cc /tmp/fiber_bundle-cc --construction optimization/experiments/GH-178/raw/construction.json --out /tmp/fiber_bundle-audit.json
      - name: Retain every raw result even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result={}
          for label in ('fiber_bundle-maxsat','fiber_bundle-cc'):
              root=Path('/tmp')/label
              result[label]={p.name:p.read_text() for p in root.glob('*') if p.is_file()}
          print('GH178_EVIDENCE_JSON='+json.dumps(result,separators=(',',':')))
          audit=Path('/tmp/fiber_bundle-audit.json')
          if audit.exists():print('GH178_AUDIT_JSON='+json.dumps(json.loads(audit.read_text()),separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh178-fiber_bundle-smoke
          path: |
            /tmp/fiber_bundle-maxsat/
            /tmp/fiber_bundle-cc/
            /tmp/fiber_bundle-audit.json
          if-no-files-found: warn
          retention-days: 14
