name: Recover HGP smoke evidence

on:
  push:
    branches: [codex/hgp-repetition-library]
    paths: ['.github/workflows/hgp-evidence.yml']

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gh153-hgp-smoke
          path: /tmp/hgp-attempt1
          run-id: 40656041189
          github-token: ${{ github.token }}
      - name: Print exact artifact text for durable evidence retention
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = {str(p.relative_to('/tmp/hgp-attempt1')):p.read_text()
                   for p in Path('/tmp/hgp-attempt1').rglob('*') if p.is_file()}
          print('GH153_EVIDENCE_JSON='+json.dumps(files,separators=(',',':')))
          PY
  large-input-loading:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Build unchanged solver
        run: make --jobs=2 bin/distqldpc
      - name: Supplemental 60-second check with a one-second pre-pass
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, platform, subprocess, time
          from pathlib import Path
          out = Path('/tmp/hgp-followup'); out.mkdir()
          stem = 'HGP_1105_1_unknown'
          cpu = min(os.sched_getaffinity(0))
          cmd = ['timeout','--kill-after=5s','90s','taskset','-c',str(cpu),
                 'prlimit','--as=4294967296','--','./bin/distqldpc',
                 '-cpu-lim=60','-ub-pre=1','-v','data/matrices/untiered/'+stem]
          meta = dict(cmd=cmd, source_head=os.environ['GITHUB_SHA'],
                      run_id=os.environ['GITHUB_RUN_ID'], platform=platform.platform(),
                      binary_sha256=hashlib.sha256(Path('bin/distqldpc').read_bytes()).hexdigest(),
                      input_sha256={kind:hashlib.sha256(Path('data/matrices/untiered/'+stem+'_'+kind+'.txt').read_bytes()).hexdigest()
                                    for kind in ('Hx','Hz','Gx','Gz')})
          (out/'metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          started = time.monotonic()
          with (out/'solver.log').open('w') as log:
              p = subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,stdin=subprocess.DEVNULL)
          meta.update(rc=p.returncode,wall_seconds=round(time.monotonic()-started,3))
          (out/'metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          spec = importlib.util.spec_from_file_location('smoke','scripts/codegen/smoke_untiered.py')
          smoke = importlib.util.module_from_spec(spec); spec.loader.exec_module(smoke)
          result = smoke.parse((out/'solver.log').read_text(),24)
          assert p.returncode in (0,1) and (p.returncode==0)==(result['status']=='SOLVED')
          (out/'result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(result)
          PY
      - name: Preserve complete supplemental evidence in the log
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          print('GH153_FOLLOWUP_JSON='+json.dumps({p.name:p.read_text() for p in Path('/tmp/hgp-followup').glob('*') if p.is_file()},separators=(',',':')))
          PY
