name: Schreier source-distance hold contracts

on:
  push:
    branches: [codex/schreier-tanner-library]
    paths:
      - 'scripts/codegen/schreier*'
      - 'scripts/codegen/validate_schreier.py'
      - 'tests/test_codegen_schreier.py'
      - 'optimization/experiments/GH-202/raw/audit_failed_smoke.py'
      - 'data/matrices/untiered/quarantine/GH-202/**'

permissions:
  contents: read

jobs:
  hold-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Eighteen algebra and no-adoption hold contracts, no solver
        run: python3 tests/test_codegen_schreier.py
      - name: Replay retained failure and actual GF2 words, no solver
        run: |
          cp optimization/experiments/GH-202/raw/source-distance-hold.json /tmp/expected-hold.json
          python3 optimization/experiments/GH-202/raw/audit_failed_smoke.py
          cmp optimization/experiments/GH-202/raw/source-distance-hold.json /tmp/expected-hold.json
