name: Trivariate tricycle upper-only library smoke

on:
  push:
    branches: [codex/tricycle-library]
    paths:
      - '.github/workflows/tt-library-smoke.yml'
      - 'scripts/codegen/tt*'
      - 'scripts/codegen/validate_tt.py'
      - 'scripts/codegen/audit_tt_smoke.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/validate_css.py'
      - 'tests/test_codegen_tt.py'
      - 'data/matrices/untiered/TT_*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build unchanged solver
        run: make --jobs=2 bin/distqldpc
      - name: Full independent columns and logicals, tiny units and inventory
        run: |
          python3 tests/test_codegen_tt.py
          python3 tests/test_codegen_twisted_torus.py
          python3 tests/test_codegen_color666.py
          python3 tests/test_codegen_hgp.py
          python3 tests/test_codegen_cycle.py
          python3 scripts/codegen/validate_tt.py --out /tmp/tt-construction.json
          cmp optimization/experiments/GH-198/raw/construction.json /tmp/tt-construction.json
          python3 scripts/codegen/validate_css.py --output /tmp/css-validation.json
          cmp data/matrices/untiered/validation.json /tmp/css-validation.json
      - name: Reproduce all twenty-four matrices
        run: |
          python3 scripts/codegen/tt.py --all --out /tmp/tt-rebuilt
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/tt-rebuilt').glob('*.txt'))
          assert len(files)==24
          for p in files: assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          print('PASS all twenty-four matrices byte-identical')
          PY
      - name: Six default serial bounded MaxSAT checks
        run: python3 scripts/codegen/smoke_untiered.py --ci --family TT --verbose --out /tmp/tt-maxsat
      - name: Six independent serial bounded CC checks
        run: python3 scripts/codegen/smoke_untiered.py --ci --family TT --verbose --engine cc --out /tmp/tt-cc
      - name: Actual words, source intervals and independent-engine audit
        run: |
          python3 scripts/codegen/audit_tt_smoke.py --maxsat /tmp/tt-maxsat --cc /tmp/tt-cc --construction /tmp/tt-construction.json --out /tmp/tt-audit.json
          python3 - <<'PY'
          from pathlib import Path
          print('GH198_AUDIT_JSON='+Path('/tmp/tt-audit.json').read_text().replace('\n',''))
          PY
      - name: Retain all evidence even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result={}
          for label in ['tt-maxsat','tt-cc']:
              result[label]={p.name:p.read_text() for p in Path('/tmp',label).glob('*') if p.is_file()}
          print('GH198_EVIDENCE_JSON='+json.dumps(result,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh198-tt-smoke
          path: |
            /tmp/tt-maxsat/
            /tmp/tt-cc/
            /tmp/tt-construction.json
            /tmp/tt-audit.json
          if-no-files-found: warn
          retention-days: 14

