name: Library inventory metadata contracts

on:
  push:
    branches: [codex/library-coverage-index]
    paths:
      - '.github/workflows/library-inventory.yml'
      - 'scripts/library_inventory.py'
      - 'tests/test_library_inventory.py'
      - 'docs/library/REFS.json'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned main Git object for metadata fixture
        run: git fetch --no-tags --depth=1 origin 6083e662c621f3b66defd434cfae31a028d483c4
      - name: Nineteen fixture contracts and pinned main inventory
        run: python3 tests/test_library_inventory.py
