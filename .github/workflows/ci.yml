name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential zlib1g-dev

      - name: Build DistQLDPC
        run: make --jobs="$(nproc)"

      - name: Run smoke validation
        run: bash scripts/smoke_test.sh

      - name: Validate partition soft-literal regression
        run: python3 -B scripts/test_partition_soft_literals.py

      - name: Validate partition list and objective invariants
        run: |
          g++ -Isrc/solver -Wall -Wno-parentheses -O3 -g -D__STDC_LIMIT_MACROS -D__STDC_FORMAT_MACROS -DNDEBUG tests/test_partition_soft_literals.cc build/SimpSolver.o build/Solver.o build/Options.o build/System.o -lz -o build/test_partition_soft_literals
          timeout 20s build/test_partition_soft_literals
