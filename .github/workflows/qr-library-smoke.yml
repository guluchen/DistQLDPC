name: QR retained evidence contracts

on:
  push:
    branches: [codex/quadratic-residue-library]
    paths:
      - 'scripts/codegen/qr*'
      - 'scripts/codegen/validate_qr.py'
      - 'scripts/codegen/audit_qr_smoke.py'
      - 'scripts/codegen/smoke_qr.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'tests/test_codegen_qr*.py'
      - 'data/matrices/untiered/QR_*.txt'
      - 'optimization/experiments/GH-208/runner/**'
      - 'optimization/experiments/GH-208/raw/actions/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Independent finite certificates, physical roots, logicals and unit guards without solver
        run: |
          python3 -m unittest discover -s tests -p 'test_codegen_*.py'
          python3 scripts/codegen/validate_css.py --output /tmp/gh208-css.json
          cmp data/matrices/untiered/validation.json /tmp/gh208-css.json
          python3 scripts/codegen/validate_qr.py --out /tmp/gh208-construction.json
          cmp optimization/experiments/GH-208/raw/construction.json /tmp/gh208-construction.json
      - name: Reproduce all20 physical matrix files byte for byte
        run: |
          python3 scripts/codegen/qr.py --all --out /tmp/gh208-rebuilt
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/gh208-rebuilt').glob('*.txt'))
          assert len(files)==20
          for p in files:
              assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          print('PASS20matrixbyteidentical')
          PY
      - name: Replay original ten engine logs and actual GF2 words only
        run: |
          python3 scripts/codegen/audit_qr_smoke.py --maxsat optimization/experiments/GH-208/raw/actions/default/maxsat --cc optimization/experiments/GH-208/raw/actions/default/cc --construction optimization/experiments/GH-208/raw/construction.json --out /tmp/gh208-replayed.json
          cmp optimization/experiments/GH-208/raw/actions/default/audit.json /tmp/gh208-replayed.json
      - name: Verify retained raw evidence identities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          hashes=json.loads(Path('optimization/experiments/GH-208/raw/retained-sha256.json').read_text())
          for p,h in hashes.items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          print('PASS retained SHA256 identities',len(hashes))
          PY
