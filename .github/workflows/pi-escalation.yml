name: PI Escalation

on:
  repository_dispatch:
    types: [pi-escalation]
  push:
    paths:
      - ".github/pi-escalation-test-trigger"

permissions:
  contents: read

jobs:
  surface:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write escalation summary
        shell: bash
        env:
          KIND: ${{ github.event.client_payload.kind || 'integration-test' }}
          SOURCE_WORKFLOW: ${{ github.event.client_payload.source_workflow || 'PI Escalation integration test' }}
          RUN_URL: ${{ github.event.client_payload.run_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          SOURCE_SHA: ${{ github.event.client_payload.sha || github.sha }}
        run: |
          {
            echo "# Decision needed"
            echo
            echo "Kind: **$KIND**"
            echo
            echo "Source workflow: **$SOURCE_WORKFLOW**"
            echo
            echo "Source SHA: `$SOURCE_SHA`"
            echo
            echo "Source run: $RUN_URL"
            echo
            echo "This workflow is intentionally created only for events that require PI attention."
          } >> "$GITHUB_STEP_SUMMARY"
