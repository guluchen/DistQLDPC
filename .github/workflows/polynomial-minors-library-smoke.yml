name: Polynomial-minor retained evidence contracts

on:
  push:
    branches: [codex/polynomial-minors-library]
    paths:
      - 'scripts/codegen/polynomial_minors*'
      - 'scripts/codegen/validate_polynomial_minors.py'
      - 'scripts/codegen/audit_polynomial_minors_smoke.py'
      - 'scripts/codegen/smoke_polynomial_minors.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'tests/test_codegen_polynomial_minors*.py'
      - 'data/matrices/untiered/PM_*.txt'
      - 'optimization/experiments/GH-209/runner/**'
      - 'optimization/experiments/GH-209/raw/actions/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Independent physical, Smith, logical, constructive-word and unit guards without solver
        run: |
          python3 -m unittest discover -s tests -p 'test_codegen_*.py'
          python3 scripts/codegen/validate_css.py --output /tmp/gh209-css.json
          cmp data/matrices/untiered/validation.json /tmp/gh209-css.json
          python3 scripts/codegen/validate_polynomial_minors.py --out /tmp/gh209-construction.json
          cmp optimization/experiments/GH-209/raw/construction.json /tmp/gh209-construction.json
      - name: Reproduce all24 physical matrix files byte for byte
        run: |
          python3 scripts/codegen/polynomial_minors.py --all --out /tmp/gh209-rebuilt
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/gh209-rebuilt').glob('*.txt'))
          assert len(files)==24
          for p in files:
              assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          print('PASS24matrixbyteidentical')
          PY
      - name: Replay original twelve engine logs and actual GF2 words only
        run: |
          python3 scripts/codegen/audit_polynomial_minors_smoke.py --maxsat optimization/experiments/GH-209/raw/actions/default/maxsat --cc optimization/experiments/GH-209/raw/actions/default/cc --construction optimization/experiments/GH-209/raw/construction.json --out /tmp/gh209-replayed.json
          cmp optimization/experiments/GH-209/raw/actions/default/audit.json /tmp/gh209-replayed.json
      - name: Verify complete retained raw evidence identities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          hashes=json.loads(Path('optimization/experiments/GH-209/raw/retained-sha256.json').read_text())
          for p,h in hashes.items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          print('PASS retained SHA256 identities',len(hashes))
          PY
