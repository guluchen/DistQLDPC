name: Published lower-only GB library smoke

on:
  push:
    branches: [codex/lower-reference-gb-library]
    paths:
      - '.github/workflows/lower-reference-gb-library-smoke.yml'
      - 'scripts/codegen/lower_reference_gb*'
      - 'scripts/codegen/validate_lower_reference_gb.py'
      - 'scripts/codegen/audit_lower_reference_gb_smoke.py'
      - 'scripts/codegen/verify_css_witness.py'
      - 'scripts/codegen/smoke_untiered.py'
      - 'scripts/codegen/validate_css.py'
      - 'tests/test_codegen_lower_reference_gb.py'
      - 'data/matrices/untiered/GB_*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build unchanged solver
        run: make --jobs=2 bin/distqldpc
      - name: Full independent columns and logicals, tiny units and inventory
        run: |
          python3 tests/test_codegen_lower_reference_gb.py
          python3 tests/test_codegen_twisted_torus.py
          python3 tests/test_codegen_color666.py
          python3 tests/test_codegen_hgp.py
          python3 tests/test_codegen_cycle.py
          python3 scripts/codegen/validate_lower_reference_gb.py --out /tmp/gb-construction.json
          cmp optimization/experiments/GH-196/raw/construction.json /tmp/gb-construction.json
          python3 scripts/codegen/validate_css.py --output /tmp/css-validation.json
          cmp data/matrices/untiered/validation.json /tmp/css-validation.json
      - name: Reproduce all eight matrices
        run: |
          python3 scripts/codegen/lower_reference_gb.py --all --out /tmp/gb-rebuilt
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('/tmp/gb-rebuilt').glob('*.txt'))
          assert len(files)==8
          for p in files: assert p.read_bytes()==(Path('data/matrices/untiered')/p.name).read_bytes(),p
          print('PASS all eight matrices byte-identical')
          PY
      - name: Two default serial bounded MaxSAT checks
        run: python3 scripts/codegen/smoke_untiered.py --ci --family GB --verbose --out /tmp/lower-reference-gb-maxsat
      - name: Two independent serial bounded CC checks
        run: python3 scripts/codegen/smoke_untiered.py --ci --family GB --verbose --engine cc --out /tmp/lower-reference-gb-cc
      - name: Actual words, source intervals and independent-engine audit
        run: |
          python3 scripts/codegen/audit_lower_reference_gb_smoke.py --maxsat /tmp/lower-reference-gb-maxsat --cc /tmp/lower-reference-gb-cc --construction /tmp/gb-construction.json --out /tmp/gb-audit.json
          python3 - <<'PY'
          from pathlib import Path
          print('GH196_AUDIT_JSON='+Path('/tmp/gb-audit.json').read_text().replace('\n',''))
          PY
      - name: Retain all evidence even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result={}
          for label in ['lower-reference-gb-maxsat','lower-reference-gb-cc']:
              result[label]={p.name:p.read_text() for p in Path('/tmp',label).glob('*') if p.is_file()}
          print('GH196_EVIDENCE_JSON='+json.dumps(result,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gh196-lower-reference-gb-smoke
          path: |
            /tmp/lower-reference-gb-maxsat/
            /tmp/lower-reference-gb-cc/
            /tmp/gb-construction.json
            /tmp/gb-audit.json
          if-no-files-found: warn
          retention-days: 14
