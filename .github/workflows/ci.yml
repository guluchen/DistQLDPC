name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential zlib1g-dev

      - name: Verify required v2 ISA before production build
        shell: bash
        run: |
          set -euo pipefail
          g++ -O2 -march=x86-64 -mtune=generic optimization/experiments/GH-48/cpu_isa_gate.cc -o "$RUNNER_TEMP/gh48-portable-isa-gate"
          "$RUNNER_TEMP/gh48-portable-isa-gate" > "$RUNNER_TEMP/gh48-isa-gate.json"
          cat "$RUNNER_TEMP/gh48-isa-gate.json"

      - name: Build DistQLDPC
        run: make --jobs="$(nproc)"

      - name: Run smoke validation
        run: bash scripts/smoke_test.sh
